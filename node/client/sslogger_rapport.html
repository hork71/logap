  <link rel="stylesheet" href="css/rapport.css">
  <title>Sslogger Rapport</title>

<body>
  <div class="container">
    <!-- Nav -->
    <nav class="main-nav">
      <img class="logo" src="../images/linux_PNG23.png" alt="Linux">
      <ul class="main-menu">
        <li><a href="./sslogger_admin.html">Administratie</a></li>
        <li><a href="./sslogger_rapport.html">Rapportage</a></li>
        <li><a href="./live.html">Live</a></li>
        <li><a href="./patch.html">Patch</a></li>
      </ul>
      <ul class="right-menu">
        <li>
          <div class="periode">
            <form name="periodeform" onsubmit="getMonth()">
              <div class="dropdown">
                <input type="month" id="start" name="start" min="2025-04" max="2026-04" required>
                <!--<select name="start" id="jaar">
                </select>
                <select id="maand">
                </select> -->
                <input type="submit" id="knop" value="Selecteer">

              <form>

      </ul>

    <div class="select-container">
      <select id="groepnamen">
        <option selected>Ongefilterd</option>
      </select>
    </div>
    <div class="graf-container">
      <div id="stat-list" class="month-chart"></div>
      <div class="tooltip">
        <div class="tip-header">
          <h3></h3>
          <h4></h4>
        </div>
      </div>
    </div>
    <div class="controls" id="wrapper">
      <button class="controls" data-name="Groep">Groep</button>
      <button class="controls" data-name="Server">Server</button>
      <button class="controls" data-name="Account">Account</button>
      <button class="controls" data-name="Owner">Owner</button>
    </div>
    <div id="data-list" class="table-responsive"></div>
  </div>
  <script src="js/d3.v5.min.js"></script>
  <script type="text/javascript" src="js/sslogger_report.js"></script>
